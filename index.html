<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
:root{
  --bg:#f5f6f8;--surface:#fff;--surface2:#f0f2f5;
  --border:#e2e6ea;--border-strong:#c8cdd4;
  --primary:#1a3a5c;--accent:#0078d4;--accent-soft:#e8f2fc;
  --success:#107c10;--success-soft:#e6f4e6;
  --warn:#b35900;--warn-soft:#fff4e0;
  --danger:#a4262c;--danger-soft:#fde7e9;
  --tx:#1b1f26;--tx-sub:#5a6270;--tx-m:#8c95a0;
  --sw:290px;--hh:90px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.7;}

/* ── HEADER ── */
#hdr{position:fixed;top:0;left:0;right:0;z-index:300;
  background:var(--primary);box-shadow:0 2px 10px rgba(0,0,0,.25);}
.hdr-top{height:52px;display:flex;align-items:center;
  justify-content:space-between;padding:0 20px;
  border-bottom:1px solid rgba(255,255,255,.1);}
.h-left{display:flex;align-items:center;gap:10px;}
.h-logo{font-size:11px;font-weight:700;color:#fff;letter-spacing:.06em;
  background:rgba(255,255,255,.14);padding:3px 9px;border-radius:4px;}
.h-title{font-size:14px;font-weight:600;color:rgba(255,255,255,.85);}
.h-right{display:flex;align-items:center;gap:6px;}
.h-ver{font-size:11px;color:rgba(255,255,255,.35);margin-right:4px;}
.h-btn{padding:5px 12px;border-radius:5px;border:1px solid rgba(255,255,255,.25);
  background:rgba(255,255,255,.1);color:#fff;font-size:12px;font-weight:600;
  cursor:pointer;font-family:inherit;transition:background .15s;}
.h-btn:hover{background:rgba(255,255,255,.22);}
.h-btn:disabled{opacity:.4;cursor:default;}
.h-btn:disabled:hover{background:rgba(255,255,255,.1);}
/* System tabs row */
.hdr-tabs{height:38px;display:flex;align-items:center;
  padding:0 20px;gap:3px;overflow-x:auto;scrollbar-width:none;}
.hdr-tabs::-webkit-scrollbar{display:none;}
.sys-tab{padding:5px 14px;border-radius:5px;font-size:12px;font-weight:600;
  color:rgba(255,255,255,.6);cursor:pointer;white-space:nowrap;
  transition:all .14s;border:1px solid transparent;user-select:none;}
.sys-tab:hover{color:#fff;background:rgba(255,255,255,.12);}
.sys-tab.on{color:#fff;background:rgba(255,255,255,.18);
  border-color:rgba(255,255,255,.3);}
.sys-add-btn{width:26px;height:26px;border-radius:5px;border:1px solid rgba(255,255,255,.25);
  background:rgba(255,255,255,.08);color:rgba(255,255,255,.7);
  font-size:14px;cursor:pointer;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;transition:all .14s;margin-left:4px;}
.sys-add-btn:hover{background:rgba(255,255,255,.2);color:#fff;}

/* ── SIDEBAR ── */
#sb{position:fixed;top:var(--hh);left:0;bottom:0;width:var(--sw);
  background:var(--surface);border-right:1px solid var(--border);
  overflow:hidden;z-index:200;display:flex;flex-direction:column;}
#sb-scroll{flex:1;overflow-y:auto;}
.sb-cat{border-bottom:1px solid var(--border);}
.sb-cat-hd{display:flex;align-items:center;}
.sb-cat-btn{flex:1;display:flex;align-items:center;gap:8px;padding:10px 12px;
  cursor:pointer;background:none;border:none;font-family:inherit;
  font-size:13px;font-weight:600;color:var(--tx-sub);text-align:left;
  transition:all .14s;min-width:0;}
.sb-cat-btn:hover{background:var(--surface2);color:var(--primary);}
.sb-cat-btn.on{color:var(--accent);}
.sb-cat-btn .ci{font-size:14px;flex-shrink:0;}
/* 대메뉴명: 폰트 축소 + 최대 2줄 표시 후 말줄임 (전체 텍스트는 툴팁) */
.sb-cat-btn .cl{flex:1;min-width:0;font-size:12px;line-height:1.4;overflow:hidden;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;
  white-space:normal;word-break:keep-all;overflow-wrap:anywhere;}
.sb-cat-btn .ca{font-size:10px;color:var(--tx-m);transition:transform .2s;flex-shrink:0;}
.sb-cat-btn.on .ca{transform:rotate(90deg);}
.sb-act{display:flex;gap:1px;padding:0 4px;flex-shrink:0;}
.ic-btn{width:24px;height:24px;border:none;background:none;cursor:pointer;
  border-radius:4px;display:flex;align-items:center;justify-content:center;
  font-size:12px;opacity:.5;transition:all .13s;}
.ic-btn:hover{background:var(--surface2);opacity:1;}
.ic-btn.d:hover{background:var(--danger-soft);}
.sb-steps{display:none;background:var(--surface2);padding:3px 0 6px;}
.sb-steps.open{display:block;}
/* 소메뉴 행 — 핸들 + 이름만 표시 */
.sb-step-row{display:flex;align-items:center;border-left:3px solid transparent;
  transition:all .12s;user-select:none;}
.sb-step-row:hover{background:rgba(0,120,212,.06);}
.sb-step-row.on{background:var(--accent-soft);border-left-color:var(--accent);}
.sb-step-row.dragging{opacity:.35;}
.sb-step-row.drag-over{border-top:2px solid var(--accent);}
.dh{cursor:grab;padding:5px 3px 5px 8px;color:var(--tx-m);font-size:11px;flex-shrink:0;}
.dh:active{cursor:grabbing;}
.sb-step-btn{flex:1;display:flex;align-items:center;gap:7px;
  padding:6px 10px 6px 2px;background:none;border:none;font-family:inherit;
  font-size:12px;color:var(--tx-sub);cursor:pointer;text-align:left;min-width:0;}
.sn{min-width:17px;height:17px;border-radius:8px;background:var(--border);
  color:var(--tx-m);font-size:10px;font-weight:700;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sb-step-row.on .sn{background:var(--accent);color:#fff;}
.sl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sb-add-step-btn{display:flex;align-items:center;gap:6px;
  padding:6px 12px 6px 34px;font-size:12px;color:var(--accent);
  cursor:pointer;background:none;border:none;font-family:inherit;width:100%;}
.sb-add-step-btn:hover{background:var(--accent-soft);}
.sb-footer{padding:10px 12px;border-top:1px solid var(--border);background:var(--surface);}
.sb-add-cat-btn{width:100%;padding:8px;border:1.5px dashed var(--border-strong);
  border-radius:6px;background:none;color:var(--tx-sub);font-size:12px;
  font-weight:600;cursor:pointer;font-family:inherit;transition:all .14s;}
.sb-add-cat-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}

/* ── MAIN ── */
#main{margin-left:var(--sw);padding-top:var(--hh);}
.page{display:none;padding:22px 34px 60px;max-width:960px;}
.page.on{display:block;}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:18px;
  padding:9px 14px;background:var(--surface);border:1px solid var(--border);border-radius:8px;}
.tb-lbl{font-size:12px;color:var(--tx-m);flex:1;}
.btn-s{padding:5px 12px;border-radius:5px;border:1px solid var(--border);
  background:var(--surface);color:var(--tx);font-size:12px;font-weight:600;
  cursor:pointer;display:flex;align-items:center;gap:4px;font-family:inherit;
  transition:all .14s;white-space:nowrap;}
.btn-s:hover{border-color:var(--accent);color:var(--accent);}
.btn-s.pri{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn-s.pri:hover{background:var(--primary);border-color:var(--primary);}
.btn-s.dng{background:var(--danger);color:#fff;border-color:var(--danger);}
.btn-s.dng:hover{background:#7b1a1e;}
.btn-s.gh{background:var(--surface);color:var(--tx-sub);}
.pg-hd{margin-bottom:18px;padding-bottom:14px;border-bottom:2px solid var(--border);}
.pg-hd h1{font-size:19px;font-weight:700;color:var(--primary);margin-bottom:3px;}
.pg-hd p{font-size:13px;color:var(--tx-sub);}
.pg-prog{margin-bottom:18px;}
.pp-top{display:flex;justify-content:space-between;font-size:12px;color:var(--tx-m);margin-bottom:5px;}
.pp-bar{height:5px;background:var(--border);border-radius:10px;overflow:hidden;}
.pp-fill{height:100%;background:var(--accent);border-radius:10px;transition:width .4s;}
/* Section card */
.sc{background:var(--surface);border:1px solid var(--border);border-radius:10px;
  margin-bottom:18px;overflow:hidden;scroll-margin-top:calc(var(--hh) + 14px);}
.sc-hd{display:flex;align-items:center;gap:12px;padding:13px 20px;
  border-bottom:1px solid var(--border);}
.sc-num{width:26px;height:26px;border-radius:7px;background:var(--primary);
  color:#fff;font-size:12px;font-weight:700;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sc-hd h2{font-size:15px;font-weight:700;color:var(--primary);flex:1;}
.tag{font-size:11px;font-weight:600;padding:2px 10px;border-radius:20px;white-space:nowrap;}
.t-req{background:#fde7e9;color:var(--danger);}
.t-in{background:var(--accent-soft);color:var(--accent);}
.t-ex{background:var(--success-soft);color:var(--success);}
.t-opt{background:var(--surface2);color:var(--tx-m);}
.t-case{background:#f3e8ff;color:#7c3aed;}
.sc-hd-acts{display:flex;gap:4px;}
.sc-body{padding:16px 20px;}
/* content blocks */
.itbl{width:100%;border-collapse:collapse;margin-bottom:12px;}
.itbl th{text-align:left;padding:7px 11px;background:var(--surface2);
  font-size:12px;font-weight:600;color:var(--tx-sub);
  border-bottom:1px solid var(--border);width:150px;}
.itbl td{padding:7px 11px;font-size:13px;border-bottom:1px solid var(--border);
  white-space:pre-wrap;word-break:break-word;}
.itbl tr:last-child th,.itbl tr:last-child td{border-bottom:none;}
.cl-list{list-style:none;}
.cl-list li{display:flex;align-items:flex-start;gap:9px;padding:7px 0;
  border-bottom:1px solid var(--border);font-size:13px;}
.cl-list li:last-child{border-bottom:none;}
.cl-list li input[type=checkbox]{margin-top:3px;flex-shrink:0;
  width:14px;height:14px;cursor:pointer;accent-color:var(--accent);}
.cl-list li label{cursor:pointer;flex:1;min-width:0;white-space:pre-wrap;word-break:break-word;}
.who{font-size:11px;padding:2px 8px;border-radius:20px;
  background:var(--surface2);color:var(--tx-m);white-space:nowrap;align-self:flex-start;}
.nt{display:flex;gap:9px;align-items:flex-start;
  padding:10px 14px;border-radius:7px;margin:9px 0;font-size:13px;}
.nt-w{background:var(--warn-soft);border-left:3px solid var(--warn);color:var(--warn);}
.nt-i{background:var(--accent-soft);border-left:3px solid var(--accent);color:#1a5094;}
.nt-ok{background:var(--success-soft);border-left:3px solid var(--success);color:var(--success);}
.ni{font-size:14px;flex-shrink:0;margin-top:1px;}
.nt>span:not(.ni){flex:1;min-width:0;white-space:pre-wrap;word-break:break-word;}
.tl{position:relative;padding-left:20px;margin:8px 0;}
.tl::before{content:'';position:absolute;left:6px;top:0;bottom:0;width:2px;background:var(--border);}
.tl-i{position:relative;padding:0 0 12px 16px;}
.tl-i:last-child{padding-bottom:0;}
.tl-d{position:absolute;left:-20px;top:5px;width:12px;height:12px;
  border-radius:50%;background:var(--accent);border:2px solid #fff;
  box-shadow:0 0 0 2px var(--accent);}
.tl-dt{font-size:11px;font-weight:700;color:var(--accent);margin-bottom:2px;}
.tl-tx{font-size:13px;white-space:pre-wrap;word-break:break-word;}
.tl-sb{font-size:12px;color:var(--tx-m);margin-top:2px;white-space:pre-wrap;word-break:break-word;}
/* 절차 항목 배경색 (대화 흐름에서 고객/상담원 구분 등) */
.tl-i.tlbg{padding:8px 12px 8px 16px;margin-bottom:6px;border-radius:8px;}
.tl-i.tlbg:last-child{margin-bottom:0;padding-bottom:8px;}
.tl-i.tlbg .tl-d{top:13px;}
.tlbg-b{background:#e8f1fb;} .tlbg-b .tl-dt{color:#1a5094;}
.tlbg-y{background:#fff4e0;} .tlbg-y .tl-dt{color:#b35900;}
.tlbg-g{background:#e6f4ea;} .tlbg-g .tl-dt{color:#1e7b3a;}
.tlbg-r{background:#fde7e9;} .tlbg-r .tl-dt{color:#c42b1c;}
.tlbg-p{background:#f3e8ff;} .tlbg-p .tl-dt{color:#7c3aed;}
.tlbg-s{background:#eef0f3;} .tlbg-s .tl-dt{color:#4b5563;}
/* 편집 모달 배경색 선택 */
.tlc-row{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--tx-m);}
.tlc{width:18px;height:18px;border-radius:50%;border:1px solid var(--border-strong);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:var(--tx-m);}
.tlc.sel{box-shadow:0 0 0 2px var(--accent);border-color:var(--accent);}
.sh{font-size:13px;font-weight:700;color:var(--primary);margin:13px 0 7px;
  display:flex;align-items:center;gap:6px;}
.sh::before{content:'';display:block;width:3px;height:13px;
  background:var(--accent);border-radius:2px;}
.txt-block{font-size:13px;color:var(--tx);line-height:1.8;padding:4px 0;white-space:pre-wrap;word-break:break-word;}
.ilink{color:var(--accent);text-decoration:underline;word-break:break-all;}
.ilink:hover{text-decoration:none;}
code{font-family:'JetBrains Mono',monospace;background:var(--surface2);
  border:1px solid var(--border);padding:1px 5px;border-radius:4px;
  font-size:12px;color:var(--primary);}
/* images */
.iz{border:2px dashed var(--border-strong);border-radius:8px;padding:16px;
  text-align:center;background:var(--surface2);cursor:pointer;position:relative;
  transition:border-color .2s,background .2s;margin:10px 0;}
.iz:hover{border-color:var(--accent);background:var(--accent-soft);}
.iz.has{border-style:solid;border-color:var(--border);background:var(--surface);
  padding:10px;cursor:default;}
.iz-ph{color:var(--tx-m);font-size:13px;pointer-events:none;}
.iz-ph .ico{font-size:24px;margin-bottom:4px;}
.iz-ph p{font-size:12px;margin-top:2px;}
.iz input[type=file]{display:none;}
.ig{display:flex;flex-direction:column;gap:10px;}
.ii{position:relative;border:1px solid var(--border);border-radius:7px;
  overflow:hidden;width:100%;background:var(--surface);}
.ii img{width:100%;display:block;}
.ii-cap{padding:5px 8px;font-size:12px;color:var(--tx-sub);
  border-top:1px solid var(--border);outline:none;
  width:100%;background:transparent;font-family:inherit;}
.ii-cap:focus{background:var(--accent-soft);}
.ii-del{position:absolute;top:5px;right:5px;width:20px;height:20px;
  background:rgba(0,0,0,.5);color:#fff;border:none;border-radius:50%;
  cursor:pointer;font-size:11px;display:flex;align-items:center;
  justify-content:center;opacity:0;transition:opacity .14s;}
.ii:hover .ii-del{opacity:1;}
.ia-btn{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;
  background:var(--accent);color:#fff;border:none;border-radius:5px;
  font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;
  margin-top:8px;transition:background .14s;}
.ia-btn:hover{background:var(--primary);}
.ia-btn:disabled{background:var(--tx-m);cursor:not-allowed;opacity:.7;}
.ip-btn{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;
  background:#6c8ebf;color:#fff;border:none;border-radius:5px;
  font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;
  margin-top:8px;margin-left:6px;transition:background .14s;}
.ip-btn:hover{background:#4a6fa0;}
.iz.paste-ready{outline:2px dashed #6c8ebf;outline-offset:2px;}
/* 참고 스크린샷 접기 */
.ss-wrap{margin-top:16px;}
.ss-sum{cursor:pointer;list-style:none;user-select:none;margin:0;padding:4px 0;}
.ss-sum::-webkit-details-marker{display:none;}
.ss-sum::marker{content:'';}
.ss-sum:hover{color:var(--accent);}
.ss-cnt{font-size:11px;font-weight:600;color:var(--tx-m);background:var(--surface2);
  border:1px solid var(--border);border-radius:10px;padding:0 7px;}
.ss-cnt.has{color:var(--accent);background:var(--accent-soft);border-color:transparent;}
.ss-arrow{font-size:10px;color:var(--tx-m);transition:transform .18s;transform:rotate(-90deg);}
.ss-wrap[open] .ss-arrow{transform:rotate(0deg);}
.ss-wrap .iz{padding:10px;}
.ss-sum .ip-btn{margin:0 0 0 8px;padding:2px 9px;font-size:11px;vertical-align:middle;}
.ss-wrap .iz-ph .ico{font-size:18px;margin-bottom:2px;}
/* MODALS */
.mov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.46);
  z-index:1000;align-items:center;justify-content:center;}
.mov.show{display:flex;}
.modal{background:var(--surface);border-radius:12px;min-width:360px;
  max-width:92vw;box-shadow:0 8px 32px rgba(0,0,0,.22);overflow:hidden;
  display:flex;flex-direction:column;max-height:92vh;}
.modal.wide{min-width:580px;max-width:740px;}
.mhd{padding:15px 20px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.mhd h3{font-size:15px;font-weight:700;color:var(--primary);}
.mclose{background:none;border:none;cursor:pointer;font-size:18px;
  color:var(--tx-m);line-height:1;padding:2px 6px;}
.mclose:hover{color:var(--tx);}
.mbody{padding:20px;overflow-y:auto;flex:1;}
.mfoot{padding:13px 20px;border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.mfoot-right{display:flex;gap:8px;}
/* form */
.fg{margin-bottom:15px;}
.fl{display:block;font-size:12px;font-weight:600;color:var(--tx-sub);margin-bottom:6px;}
.fi{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:6px;
  font-size:13px;font-family:inherit;color:var(--tx);outline:none;
  transition:border-color .14s;}
.fi:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
textarea.fi{resize:vertical;min-height:80px;}
/* icon grid */
.icon-grid{display:flex;flex-wrap:wrap;gap:6px;max-height:190px;overflow-y:auto;padding:2px;}
.icon-opt.none{width:auto;padding:0 8px;font-size:11px;color:var(--tx-sub);}
.icon-opt{width:34px;height:34px;border:1px solid var(--border);border-radius:6px;
  background:var(--surface2);cursor:pointer;font-size:17px;
  display:flex;align-items:center;justify-content:center;transition:all .12s;}
.icon-opt:hover,.icon-opt.sel{border-color:var(--accent);background:var(--accent-soft);}
/* tag tabs */
.tag-tabs{display:flex;gap:6px;flex-wrap:wrap;}
.tt{padding:5px 12px;border-radius:20px;border:1px solid var(--border);
  font-size:12px;cursor:pointer;transition:all .12s;}
.tt-req.sel{background:#fde7e9;border-color:var(--danger);color:var(--danger);font-weight:600;}
.tt-in.sel{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600;}
.tt-ex.sel{background:var(--success-soft);border-color:var(--success);color:var(--success);font-weight:600;}
.tt-opt.sel{background:var(--surface2);border-color:var(--tx-m);color:var(--tx-m);font-weight:600;}
.tt-case.sel{background:#f3e8ff;border-color:#7c3aed;color:#7c3aed;font-weight:600;}
/* template grid */
.tpl-grid{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:14px;}
.tpl-opt{border:1.5px solid var(--border);border-radius:8px;padding:9px 13px;
  cursor:pointer;display:flex;align-items:center;gap:7px;font-size:13px;
  transition:all .13s;user-select:none;}
.tpl-opt:hover{border-color:var(--accent);background:var(--accent-soft);}
.tpl-opt.sel{border-color:var(--accent);background:var(--accent-soft);
  color:var(--accent);font-weight:600;}
.tpl-ico{font-size:17px;}
/* order list */
.ord-list{border:1px solid var(--border);border-radius:8px;padding:6px;
  min-height:46px;background:var(--surface2);}
.ord-item{display:flex;align-items:center;gap:8px;padding:7px 10px;
  background:var(--surface);border:1px solid var(--border);border-radius:6px;
  margin-bottom:5px;cursor:grab;font-size:13px;user-select:none;}
.ord-item:last-child{margin-bottom:0;}
.ord-item:active{cursor:grabbing;}
.ord-item.drag-over-top{border-top:2px solid var(--accent);}
.oi-drag{color:var(--tx-m);}
.oi-label{flex:1;}
/* block editors */
.be{border:1px solid var(--border);border-radius:8px;margin-bottom:8px;
  overflow:hidden;background:var(--surface);}
.be.drag-over{border-color:var(--accent);border-top-width:2px;}
.be.dragging{opacity:.35;}
.be-hd{display:flex;align-items:center;gap:8px;padding:8px 12px;
  background:var(--surface2);border-bottom:1px solid var(--border);
  cursor:grab;user-select:none;}
.be-hd:active{cursor:grabbing;}
.be-drag{color:var(--tx-m);font-size:11px;flex-shrink:0;}
.be-icon{font-size:14px;}
.be-label{flex:1;font-size:12px;font-weight:600;color:var(--tx-sub);}
.be-del{background:none;border:none;cursor:pointer;color:var(--tx-m);font-size:13px;padding:2px 5px;}
.be-del:hover{color:var(--danger);}
.be-mv,.oi-mv{background:none;border:none;cursor:pointer;color:var(--tx-m);font-size:11px;padding:2px 5px;}
.be-mv:hover:not(:disabled),.oi-mv:hover:not(:disabled){color:var(--accent);}
.be-mv:disabled,.oi-mv:disabled{opacity:.3;cursor:default;}
.be-body{padding:12px;}
.row-ed{display:flex;gap:7px;margin-bottom:5px;align-items:flex-start;}
.row-ed:last-child{margin-bottom:0;}
.ri{flex:1;padding:6px 9px;border:1px solid var(--border);border-radius:5px;
  font-size:12px;font-family:inherit;outline:none;background:var(--surface);}
.ri:focus{border-color:var(--accent);}
.rd-btn{background:none;border:none;cursor:pointer;color:var(--tx-m);
  font-size:13px;padding:5px;flex-shrink:0;}
.rd-btn:hover{color:var(--danger);}
.add-row-btn{display:flex;align-items:center;gap:5px;background:none;
  border:1.5px dashed var(--border);border-radius:5px;padding:5px 10px;
  font-size:12px;color:var(--tx-m);cursor:pointer;width:100%;margin-top:5px;
  transition:all .13s;font-family:inherit;}
.add-row-btn:hover{border-color:var(--accent);color:var(--accent);}
.add-row-btn.sm{width:auto;padding:5px 11px;}
/* variant tabs */
.vtabs{display:flex;gap:6px;margin-bottom:9px;}
.vt{padding:5px 12px;border-radius:20px;border:1px solid var(--border);
  font-size:12px;cursor:pointer;transition:all .12s;}
.vt-w.sel{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);font-weight:600;}
.vt-i.sel{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600;}
.vt-ok.sel{background:var(--success-soft);border-color:var(--success);color:var(--success);font-weight:600;}
.conf-msg{font-size:14px;color:var(--tx);line-height:1.75;padding:4px 0;white-space:pre-line;}
.empty-sys{text-align:center;padding:60px 20px;color:var(--tx-m);}
.empty-sys .ei{font-size:40px;margin-bottom:12px;}
.empty-sys h3{font-size:15px;font-weight:600;margin-bottom:6px;color:var(--tx-sub);}

/* ── SYNC STATUS ── */
.sync-badge{display:flex;align-items:center;gap:6px;padding:4px 11px;border-radius:5px;
  font-size:11px;font-weight:600;color:#fff;border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.1);transition:all .3s;cursor:default;white-space:nowrap;}
.sync-badge .sb-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.sync-badge.synced .sb-dot{background:#4ade80;}
.sync-badge.pending .sb-dot{background:#fbbf24;animation:pulse .8s infinite;}
.sync-badge.error .sb-dot{background:#f87171;}
.sync-badge.offline .sb-dot{background:#94a3b8;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.users-badge{display:flex;align-items:center;gap:5px;padding:4px 11px;border-radius:5px;
  font-size:11px;font-weight:600;color:rgba(255,255,255,.75);
  border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.07);}
/* ── Collapsible blocks ── */
.blk-wrap{margin-bottom:10px;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.blk-wrap:last-of-type{margin-bottom:0;}
.blk-hd{display:flex;align-items:center;gap:8px;padding:9px 14px;
  background:var(--surface2);cursor:pointer;user-select:none;
  list-style:none;font-size:13px;font-weight:600;color:var(--primary);
  border:none;outline:none;}
.blk-hd::-webkit-details-marker{display:none;}
.blk-hd::marker{content:'';}
.blk-hd:hover{background:var(--accent-soft);}
.blk-ico{font-size:14px;flex-shrink:0;}
.blk-ttl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.blk-arrow{font-size:10px;color:var(--tx-m);flex-shrink:0;
  transition:transform .18s;transform:rotate(0deg);}
.blk-wrap:not([open]) .blk-arrow{transform:rotate(-90deg);}
.blk-body{padding:14px 16px;}
@media print{#sb,#hdr,.toolbar,.sc-hd-acts,.ia-btn,.ii-del,.iz-ph,.ii-zoom-btn,.ii-ann-add-btn,#lb-ov,#ann-popup{display:none!important;}
  #main{margin:0;}.page{display:block!important;padding:16px;}.sc{break-inside:avoid;}
  .blk-wrap{border:none;}.blk-hd{display:none;}.blk-wrap:not([open]) .blk-body{display:block!important;}}
/* ── IMAGE ANNOTATION & LIGHTBOX ── */
.ii{overflow:visible;}
.ii-wrap{position:relative;line-height:0;display:block;overflow:visible;border-radius:7px 7px 0 0;}
.ii-wrap img{width:100%;display:block;border-radius:7px 7px 0 0;}
.ii-ann-layer{position:absolute;inset:0;pointer-events:none;}
.ann-badge{
  position:absolute;width:22px;height:22px;
  background:var(--accent);color:#fff;border-radius:50%;
  border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.45);
  font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  transform:translate(-50%,-50%);
  cursor:grab;pointer-events:all;user-select:none;z-index:10;
  transition:transform .12s,box-shadow .12s;}
.ann-badge:hover{transform:translate(-50%,-50%) scale(1.3);box-shadow:0 3px 10px rgba(0,0,0,.5);}
.ann-badge.ann-drag{cursor:grabbing;transform:translate(-50%,-50%) scale(1.3);opacity:.8;}
.ann-tip{
  position:fixed;top:0;left:0;
  background:rgba(18,28,48,.93);color:#fff;
  border-radius:7px;padding:7px 11px;

<script>
'use strict';
/* ════ UTILS ════ */
var _uid=3000;
const uid=()=>'x'+(++_uid);
/* 로드된 데이터의 모든 id를 훑어 _uid 카운터를 최대값 이상으로 올려 id 충돌(중복) 방지.
   Firebase 데이터에는 _uid가 저장되지 않으므로, 로드 직후 반드시 호출해야 새로 생성되는
   id가 기존 id와 겹치지 않는다. (겹치면 find()가 첫 항목을 반환해 엉뚱한 행이 수정됨) */
function syncUid(data){
  var max=_uid;
  (function walk(o){
    if(!o||typeof o!=='object') return;
    if(Array.isArray(o)){for(var i=0;i<o.length;i++) walk(o[i]);return;}
    if(typeof o.id==='string'){var m=/^x(\d+)$/.exec(o.id);if(m){var n=+m[1];if(n>max)max=n;}}
    for(var k in o){if(k==='src')continue;walk(o[k]);}
  })(data);
  _uid=max;
}
/* 이미 저장된 데이터 안에 중복 id가 있으면(과거 _uid 미저장 버그로 생성됨) 새 고유 id로 재발급.
   첫 번째로 등장하는 항목은 원래 id를 유지(이미지가 step id로 연결되어 있어 링크 보존),
   이후 중복 항목만 uid()로 새 id를 받는다. 반드시 syncUid() 이후에 호출해야 안전한 새 id가 나온다.
   변경이 있었으면 true를 반환하여 호출부에서 Firebase에 정리된 데이터를 저장하도록 한다. */
function dedupeIds(systems){
  if(!Array.isArray(systems)) return false;
  var seen={}, changed=false;
  function fix(o){
    if(o && typeof o.id==='string'){
      if(seen[o.id]){ o.id=uid(); changed=true; }
      seen[o.id]=true;
    }
  }
  systems.forEach(function(sys){
    fix(sys);
    (sys.cats||[]).forEach(function(cat){
      fix(cat);
      (cat.steps||[]).forEach(function(step){
        fix(step);
        (step.blocks||[]).forEach(function(bl){
          fix(bl);
          (bl.rows||[]).forEach(fix);
          (bl.items||[]).forEach(fix);
        });
      });
    });
  });
  return changed;
}

/* ════ 되돌리기(UNDO) - 최근 3회 ════
   captureUndo(): 로컬 변경이 저장될 때(scheduleWrite) 변경 직전 상태를 스택에 push (최대 3개).
   resetUndoBaseline(): 최초 로드/원격 변경 시 기준만 갱신(기록 안 함).
   doUndo(): 스택에서 직전 상태를 꺼내 복원 후 Firebase에 반영. */
var _undoStack=[], _undoBaseline=null, _undoing=false;
function _cloneSys(){ try{ return JSON.parse(JSON.stringify(window.SYSTEMS||[])); }catch(e){ return null; } }
function resetUndoBaseline(clearStack){ if(clearStack) _undoStack=[]; _undoBaseline=_cloneSys(); updateUndoBtn(); }
function captureUndo(){
  if(_undoing) return;
  if(_undoBaseline){ _undoStack.push(_undoBaseline); if(_undoStack.length>3) _undoStack.shift(); }
  _undoBaseline=_cloneSys();
  updateUndoBtn();
}
function updateUndoBtn(){ var b=document.getElementById('btn-undo'); if(b) b.disabled=(_undoStack.length===0); }
function doUndo(){
  if(!_undoStack.length) return;
  var prev=_undoStack.pop();
  _undoing=true;
  window.SYSTEMS=prev;
  _undoBaseline=_cloneSys();
  /* active 참조 보정 (복원된 데이터에 없는 id면 첫 항목으로) */
  var s=(window.SYSTEMS||[]).filter(function(x){return x.id===activeSysId;})[0]||(window.SYSTEMS||[])[0]||null;
  activeSysId=s?s.id:'';
  var c=(s&&(s.cats||[]).filter(function(x){return x.id===activeCatId;})[0])||(s&&(s.cats||[])[0])||null;
  activeCatId=c?c.id:'';
  render();
  if(typeof scheduleWrite==='function') scheduleWrite();  /* 되돌린 상태를 Firebase에 반영 */
  _undoing=false;
  updateUndoBtn();
}

/* ════ BMW 이미지 복구 (1회성) ════
   id 충돌 버그로 BMW step의 이미지가 OAS '슬롯 조정' 마지막 작업 참고스크린샷으로 들어감.
   imgStore는 step id로만 키되어(시스템/카테고리 무관), 삭제된 BMW step과 OAS step이 같은 id라
   이미지가 남아 OAS쪽에 표시됨. 이 이미지를 BMW-통합업무 > 'BMW PC Wifi 설정 방법' 새 작업으로 이동. */
function _slotLastStep(){
  var oas=(window.SYSTEMS||[]).filter(function(s){return (s.label||'')==='OAS';})[0];
  var slot=oas&&(oas.cats||[]).filter(function(c){return (c.label||'').indexOf('슬롯')>=0;})[0];
  var steps=slot?(slot.steps||[]):[];
  return steps.length?steps[steps.length-1]:null;
}
function _orphanImgs(){
  var st=_slotLastStep();
  var arr=st&&(window.imgStore||{})[st.id];
  return (arr&&arr.length)?arr:null;
}
function updateRecoverBtn(){
  var b=document.getElementById('btn-recover');
  if(b) b.style.display=_orphanImgs()?'':'none';
}
function recoverBmwImages(){
  var src=_slotLastStep(), imgs=_orphanImgs();
  if(!src||!imgs){ alert('복구할 이미지가 없습니다.'); updateRecoverBtn(); return; }
  if(!confirm('OAS \'슬롯 조정\' 마지막 작업의 참고 스크린샷 '+imgs.length+'장을\nBMW-통합업무 > \'BMW PC Wifi 설정 방법\' 새 작업으로 이동합니다.\n계속하시겠습니까?')) return;
  var SYS=window.SYSTEMS||[];
  var bmw=SYS.filter(function(s){return (s.label||'').indexOf('BMW')>=0;})[0];

// HTML 이스케이프 후 URL(http/https, www.)을 하이퍼링크로 변환
const escLink=s=>{
  const e=esc(s);
  return e.replace(/(https?:\/\/[^\s<]+|www\.[^\s<]+)/g,m=>{
    // 문장부호가 URL 끝에 붙은 경우 링크에서 제외
    let url=m, tail='';
    const tm=url.match(/([.,;:!?)\]}'"]+)$/);
    if(tm){tail=tm[1];url=url.slice(0,-tail.length);}
    const href=/^https?:\/\//.test(url)?url:'http://'+url;
    return `<a href="${href}" target="_blank" rel="noopener noreferrer" class="ilink">${url}</a>${tail}`;
  });
};

/* ════ BLOCK RENDERER ════ */
const BLK_META={
  table:    {icon:'📋',def:'표'},
  timeline: {icon:'📌',def:'절차'},
  checklist:{icon:'✅',def:'체크리스트'},
  text:     {icon:'📝',def:'텍스트'},
  notice:   {icon:'💬',def:'알림박스'}
};
function renderBlock(b){
  const meta=BLK_META[b.type]||{icon:'📄',def:'내용'};
  const ttl=esc(b.title||meta.def);
  let inner='';
  switch(b.type){
    case 'table':    inner=renderTable(b);    break;
    case 'timeline': inner=renderTimeline(b); break;
    case 'checklist':inner=renderChecklist(b);break;
    case 'text':     inner=`<div class="txt-block">${escML(b.content)}</div>`;break;
    case 'notice':   inner=renderNotice(b);   break;
    default: return '';
  }
  return `<details class="blk-wrap" open>
    <summary class="blk-hd">
      <span class="blk-ico">${meta.icon}</span>
      <span class="blk-ttl" title="${ttl}">${ttl}</span>
      <span class="blk-arrow">▾</span>
    </summary>
    <div class="blk-body">${inner}</div>
  </details>`;

function openSs(sid){const d=document.querySelector(`.ss-wrap[data-ss="${sid}"]`);if(d&&!d.open) d.open=true;_ssOpen.set(sid,true);}

/* ════ IMAGES ════ */
function attachFileInputs(){
  const cats=activeCats();
  cats.forEach(cat=>cat.steps.forEach(step=>{
    const fi=$('if-'+step.id);
    if(fi) fi.addEventListener('change',function(){
      const grid=$('ig-'+step.id);
      const cur=grid?grid.children.length:0;
      const files=[...this.files].filter(f=>f.type.startsWith('image/'));
      const remaining=10-cur;
      if(remaining<=0){alert('이미지는 최대 10장까지 추가할 수 있습니다.');this.value='';return;}
      const toAdd=files.slice(0,remaining);
      if(toAdd.length<files.length) alert(`이미지는 최대 10장까지만 추가됩니다. ${toAdd.length}장이 추가됩니다.`);
      toAdd.forEach(f=>readFile(f,step.id));
      this.value='';
    });
    const iz=$('iz-'+step.id);
    if(iz){
      iz.addEventListener('dragover',e=>e.preventDefault());
      iz.addEventListener('drop',e=>{
        e.preventDefault();
        const grid=$('ig-'+step.id);
        const cur=grid?grid.children.length:0;
        const files=[...e.dataTransfer.files].filter(f=>f.type.startsWith('image/'));
        const remaining=10-cur;
        if(remaining<=0){alert('이미지는 최대 10장까지 추가할 수 있습니다.');return;}
        const toAdd=files.slice(0,remaining);
        if(toAdd.length<files.length) alert(`이미지는 최대 10장까지만 추가됩니다. ${toAdd.length}장이 추가됩니다.`);
        toAdd.forEach(f=>readFile(f,step.id));
      });
    }
  }));
}
function updateIaBtn(sid){
  const grid=$('ig-'+sid);
  const btn=document.querySelector(`.ia-btn[data-sid="${sid}"]`);
  if(!btn||!grid) return;
  const n=grid.children.length;

  else{btn.textContent='＋ 이미지 추가';btn.disabled=false;}
}
let _pasteTargetSid=null;
async function pasteImageFromClipboard(sid){
  openSs(sid);
  const grid=$('ig-'+sid);
  const cur=grid?grid.children.length:0;
  const remaining=10-cur;
  if(remaining<=0){alert('이미지는 최대 10장까지 추가할 수 있습니다.');return;}
  try{
    if(!navigator.clipboard||!navigator.clipboard.read) throw new Error('unsupported');
    const items=await navigator.clipboard.read();
    let found=false;
    for(const item of items){
      for(const type of item.types){
        if(type.startsWith('image/')){
          const blob=await item.getType(type);
          readFile(new File([blob],'pasted.png',{type}),sid);
          found=true;break;
        }
      }
      if(found) break;
    }
    if(!found) alert('클립보드에 이미지가 없습니다.\n이미지를 먼저 복사한 후 다시 시도하세요.');
  }catch(err){
    _pasteTargetSid=sid;
    const iz=$('iz-'+sid);
    if(iz){iz.classList.add('paste-ready');iz.scrollIntoView({block:'nearest'});}
    const btn=document.querySelector(`.ip-btn[data-sid="${sid}"]`);
    const orig=btn?btn.textContent:'';
    if(btn){btn.textContent='Ctrl+V 눌러주세요';btn.disabled=true;}
    setTimeout(()=>{
      if(_pasteTargetSid===sid) _pasteTargetSid=null;
      if(iz) iz.classList.remove('paste-ready');
      if(btn){btn.textContent=orig;btn.disabled=false;}
    },4000);
  }
}
document.addEventListener('paste',e=>{
  if(!_pasteTargetSid) return;
  const sid=_pasteTargetSid;
  _pasteTargetSid=null;
  const iz=$('iz-'+sid);
  if(iz) iz.classList.remove('paste-ready');
  openSs(sid);
  const btn=document.querySelector(`.ip-btn[data-sid="${sid}"]`);
  if(btn){btn.textContent='📋 붙여넣기';btn.disabled=false;}
  const imgItems=[...e.clipboardData.items].filter(i=>i.type.startsWith('image/'));
  if(!imgItems.length){alert('클립보드에 이미지가 없습니다.');return;}
  const grid=$('ig-'+sid);
  const cur=grid?grid.children.length:0;
  const remaining=10-cur;
  if(remaining<=0){alert('이미지는 최대 10장까지 추가할 수 있습니다.');return;}
  imgItems.slice(0,remaining).forEach(item=>{const f=item.getAsFile();if(f) readFile(f,sid);});
});
function readFile(f,sid){
  compressImage(f).then(compressed=>{
    addImgDOM(sid,compressed,'');
    if(!imgStore[sid]) imgStore[sid]=[];
  });
}
function addImgDOM(sid,src,caption,skipPush,annotations){
  const grid=$('ig-'+sid),zone=$('iz-'+sid),ph=$('iph-'+sid);
  if(!grid||!zone) return;
  if(grid.children.length>=10) return;
  if(ph) ph.style.display='none';
  zone.classList.add('has');
  const item=document.createElement('div');item.className='ii';
  // Image wrapper + annotation layer
  const wrap=document.createElement('div');wrap.className='ii-wrap';
  const img=document.createElement('img');img.decoding='async';img.loading='lazy';img.src=src;
  const annLayer=document.createElement('div');annLayer.className='ii-ann-layer';
  wrap.append(img,annLayer);
  // Zoom button
  const zoomBtn=document.createElement('button');zoomBtn.className='ii-zoom-btn';zoomBtn.title='크게 보기';zoomBtn.textContent='🔍';
  zoomBtn.addEventListener('click',ev=>{ev.stopPropagation();const idx=[...grid.children].indexOf(item);openLightbox(sid,idx);});
  // Add annotation button
  const annBtn=document.createElement('button');annBtn.className='ii-ann-add-btn';annBtn.title='번호 마커 추가';annBtn.textContent='＋번호';
  annBtn.addEventListener('click',ev=>{ev.stopPropagation();addAnnBadge(sid,item);});
  // Caption
  const cap=document.createElement('input');cap.type='text';cap.className='ii-cap';cap.placeholder='캡션 입력 (선택)';cap.value=caption||'';
  cap.addEventListener('change',()=>syncImgStore(sid));
  // Delete
  const del=document.createElement('button');del.className='ii-del';del.textContent='✕';
  del.addEventListener('click',ev=>{
    ev.stopPropagation();item.remove();
    /* 그리드가 재렌더 시 재사용되므로 placeholder/zone은 현재 DOM에서 다시 찾는다 */
    if(!grid.children.length){const p=$('iph-'+sid),z=$('iz-'+sid);if(p)p.style.display='';if(z)z.classList.remove('has');}
    syncImgStore(sid);
    updateIaBtn(sid);
  });
  item.append(wrap,zoomBtn,annBtn,cap,del);
  grid.appendChild(item);
  buildAnnLayer(annLayer,annotations||[],sid,item);
  updateIaBtn(sid);
  if(!skipPush){syncImgStore(sid);}
}
function syncImgStore(sid){
  const grid=$('ig-'+sid);if(!grid) return;
  imgStore[sid]=[...grid.children].map(el=>({
    src:el.querySelector('img')?.src||'',
    caption:el.querySelector('.ii-cap')?.value||'',
    annotations:[...(el.querySelector('.ii-ann-layer')?.children||[])].map(b=>({
      x:parseFloat(b.style.left),y:parseFloat(b.style.top),desc:b.dataset.desc||''
    }))
  })).filter(x=>x.src);
  pushImages(sid);  /* 바뀐 작업의 이미지만 저장 */
}
/* 원격 변경 등으로 imgStore[sid]가 바뀌었을 때 해당 작업의 이미지 그리드만 다시 그림 */
function refreshImgGrid(sid){
  const grid=$('ig-'+sid);if(!grid) return;
  const zone=$('iz-'+sid),ph=$('iph-'+sid);
  grid.innerHTML='';
  if(ph) ph.style.display='';
  if(zone) zone.classList.remove('has');
  (imgStore[sid]||[]).forEach(img=>addImgDOM(sid,img.src,img.caption,true,img.annotations||[]));
  updateIaBtn(sid);
  /* 사용자가 직접 접지 않았다면 이미지가 생겼을 때 펼침 */
  if(!_ssOpen.has(sid)&&grid.children.length){const d=document.querySelector(`.ss-wrap[data-ss="${sid}"]`);if(d) d.open=true;}
}

function setBadgeDesc(b,desc){

    b.classList.remove('no-tip');

}
function renumLayer(layer){
  [...layer.children].forEach((b,i)=>{
    const sp=b.querySelector('span');if(sp)sp.textContent=String(i+1);
  });
}
function makeDraggable(badge,container,onEnd){
  let moved=false;
  badge.addEventListener('mousedown',function(e){
    if(e.button!==0)return;
    e.preventDefault();e.stopPropagation();
    moved=false;
    const rect=container.getBoundingClientRect();
    const sx=e.clientX,sy=e.clientY;
    function onMove(me){
      if(Math.abs(me.clientX-sx)>4||Math.abs(me.clientY-sy)>4){moved=true;badge.classList.add('ann-drag');}
      if(!moved)return;
      const x=Math.min(98,Math.max(2,(me.clientX-rect.left)/rect.width*100));
      const y=Math.min(98,Math.max(2,(me.clientY-rect.top)/rect.height*100));
      badge.style.left=x+'%';badge.style.top=y+'%';
    }
    function onUp(){
      badge.classList.remove('ann-drag');
      document.removeEventListener('mousemove',onMove);
      document.removeEventListener('mouseup',onUp);
      if(moved)onEnd&&onEnd();
    }
    document.addEventListener('mousemove',onMove);
    document.addEventListener('mouseup',onUp);
  });
  return ()=>moved;
}
function mkAnnBadge(cls,x,y,num,desc){
  const b=document.createElement('div');
  b.className=cls+(desc?'':' no-tip');
  b.style.cssText='left:'+x+'%;top:'+y+'%;';
  b.dataset.desc=desc||'';
  const sp=document.createElement('span');sp.textContent=String(num);
  b.appendChild(sp);
  if(desc){const t=document.createElement('div');t.className='ann-tip';t.textContent=desc;b.appendChild(t);}
  return b;
}
function setupTooltipDir(badge,container){
  badge.addEventListener('mouseenter',function(){
    const tip=badge.querySelector('.ann-tip');
    if(!tip)return;
    const bRect=badge.getBoundingClientRect();
    const cRect=container.getBoundingClientRect();
    const badgeCx=bRect.left+bRect.width/2;
    const tipH=tip.offsetHeight||72;
    const tipW=Math.min(tip.offsetWidth||440,cRect.width-16);
    const pad=8;
    // 수직: 이미지 영역 기준, 위 공간 부족 시 아래로
    const spaceAbove=bRect.top-cRect.top;
    const useBelow=spaceAbove<tipH+8;
    badge.classList.toggle('tip-below',useBelow);
    let tipTop=useBelow?(bRect.bottom+8):(bRect.top-tipH-8);
    tipTop=Math.max(cRect.top+pad,Math.min(cRect.bottom-tipH-pad,tipTop));
    // 수평: 배지 중앙 기준, 이미지 영역 내 클램프
    let tipLeft=badgeCx-tipW/2;
    tipLeft=Math.max(cRect.left+pad,Math.min(cRect.right-tipW-pad,tipLeft));
    // 화살표 위치: 배지 중앙이 툴팁 어디에 해당하는지 (5~95% 범위 내)
    const arrowPct=Math.max(5,Math.min(95,(badgeCx-tipLeft)/tipW*100));
    tip.style.top=tipTop+'px';
    tip.style.left=tipLeft+'px';
    tip.style.setProperty('--arrow-x',arrowPct.toFixed(1)+'%');
  });
}
var _annCb=null;
function openAnnPopup(badge,onSave,onDelete){
  closeAnnPopup();
  const popup=$('ann-popup');
  $('ann-ta').value=badge.dataset.desc||'';
  _annCb={onSave,onDelete};
  const vw=window.innerWidth,vh=window.innerHeight;
  const r=badge.getBoundingClientRect();
  let top,left;
  if(r.width===0&&r.height===0){
    // 배지가 아직 렌더링되지 않은 경우 중앙 fallback
    top=Math.max(4,vh/2-90);left=Math.max(4,vw/2-115);
  }else{
    top=r.bottom+8;left=r.left-10;
    if(top+175>vh)top=r.top-180;
    if(left+230>vw)left=vw-236;
    if(left<4)left=4;

var _lbState=null;
var _lbZoom={scale:1,x:0,y:0};
var _lbPan=null,_lbPanMoved=false;
function applyLbTransform(){
  const inner=$('lb-inner');
  inner.style.transform=`translate(${_lbZoom.x}px,${_lbZoom.y}px) scale(${_lbZoom.scale})`;
  if(!_lbPan) inner.style.cursor=_lbZoom.scale>1?'grab':'crosshair';
  const zb=$('lb-zoom-badge');
  if(_lbZoom.scale>1){
    zb.textContent=_lbZoom.scale.toFixed(1)+'×';
    zb.classList.add('show');
  }else{
    zb.classList.remove('show');
  }
  $('lb-hint').textContent=_lbZoom.scale>1
    ?'스크롤 → 확대/축소  |  드래그 → 이동  |  더블클릭 → 원래 크기  |  번호 클릭 → 설명 편집'
    :'클릭 → 번호 추가  |  스크롤 → 확대/축소  |  번호 클릭 → 설명 편집';
}
function resetLbZoom(){
  _lbZoom={scale:1,x:0,y:0};
  $('lb-inner').style.transform='';
  $('lb-inner').style.cursor='crosshair';
  $('lb-zoom-badge').classList.remove('show');
  $('lb-hint').textContent='클릭 → 번호 추가  |  스크롤 → 확대/축소  |  번호 클릭 → 설명 편집';
}
function openLightbox(sid,imgIdx){
  _lbState={sid,imgIdx};
  const entry=(imgStore[sid]||[])[imgIdx];if(!entry)return;
  $('lb-img').src=entry.src;
  buildLbLayer(entry.annotations||[]);
  resetLbZoom();
  $('lb-ov').classList.add('show');
  document.body.style.overflow='hidden';
}
function buildLbLayer(annotations){
  const layer=$('lb-ann-layer');layer.innerHTML='';
  (annotations||[]).forEach((ann,i)=>_addLbBadgeEl(ann.x,ann.y,ann.desc,i+1));
}
function _addLbBadgeEl(x,y,desc,num){
  const layer=$('lb-ann-layer'),container=$('lb-inner');
  const b=mkAnnBadge('lb-badge',x,y,num||(layer.children.length+1),desc);
  const isDrag=makeDraggable(b,container,()=>flushLbToSource());
  setupTooltipDir(b,container);
  b.addEventListener('click',function(e){
    if(isDrag())return;
    e.stopPropagation();
    openAnnPopup(b,
      desc=>{setBadgeDesc(b,desc);flushLbToSource();closeAnnPopup();},
      ()=>{b.remove();renumLayer(layer);flushLbToSource();closeAnnPopup();}
    );
  });
  layer.appendChild(b);return b;
}
function flushLbToSource(){
  if(!_lbState)return;
  const {sid,imgIdx}=_lbState;
  const anns=[...$('lb-ann-layer').children].map(b=>({
    x:parseFloat(b.style.left),y:parseFloat(b.style.top),desc:b.dataset.desc||''
  }));
  if(!imgStore[sid])imgStore[sid]=[];
  if(imgStore[sid][imgIdx])imgStore[sid][imgIdx].annotations=anns;
  const grid=$('ig-'+sid);

function updateProg(catId){
  const page=$('page-'+catId);if(!page) return;
  const cks=page.querySelectorAll('input.ck');
  const total=cks.length,done=[...cks].filter(c=>c.checked).length;
  const pct=total?Math.round(done/total*100):0;
  const f=$('pf-'+catId),t=$('pt-'+catId);
  if(f) f.style.width=pct+'%';
  if(t) t.textContent=`${done} / ${total} 완료`;
}

/* ════ SCROLL SPY ════ */
let spy=null;
function setupScrollSpy(){
  if(spy) spy.disconnect();
  spy=new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        const sid=e.target.id.replace('step-','');
        document.querySelectorAll('.sb-step-row').forEach(r=>r.classList.remove('on'));
        const row=document.querySelector(`.sb-step-row[data-step="${sid}"]`);
        if(row) row.classList.add('on');
      }
    });
  },{rootMargin:'-90px 0px -55% 0px',threshold:0});
  activeCats().forEach(c=>c.steps.forEach(s=>{const el=$('step-'+s.id);if(el) spy.observe(el);}));
}

$('main').addEventListener('change', e => {
  const ck = e.target;
  if (!ck.classList.contains('ck')) return;

  // 1) DOM에서 체크박스가 어느 step/block/item에 속하는지 찾기
  const sc = ck.closest('.sc');  // section card
  if (sc) {
    const stepId = sc.id.replace('step-', '');
    // SYSTEMS에서 해당 step 찾기
    for (const sys of (window.SYSTEMS || [])) {
      for (const cat of (sys.cats || [])) {
        const step = (cat.steps || []).find(s => s.id === stepId);
        if (step) {
          // 이 step의 checklist block에서 몇 번째 체크박스인지 계산
          const allCks = [...sc.querySelectorAll('input.ck')];
          const ckIdx = allCks.indexOf(ck);
          // SYSTEMS의 checklist 블록 items 순서와 매핑
          let itemCount = 0;
          for (const block of (step.blocks || [])) {
            if (block.type === 'checklist') {
              const items = block.items || [];
              if (ckIdx < itemCount + items.length) {
                items[ckIdx - itemCount].checked = ck.checked;
                break;
              }
              itemCount += items.length;
            }
          }
          break;
        }
      }
    }
  }

  // 2) 진행률 업데이트
  updateProg(activeCatId);

  // 3) Firebase 저장 (scheduleWrite는 window에서 오버라이드됨)
  if (typeof window.scheduleWrite === 'function') window.scheduleWrite();
});

$('lb-ov').addEventListener('wheel',function(e){
  if(!$('lb-ov').classList.contains('show'))return;
  e.preventDefault();
  const FACTOR=1.15,MIN=1,MAX=8;
  const dir=e.deltaY<0?FACTOR:1/FACTOR;
  const newScale=Math.min(MAX,Math.max(MIN,_lbZoom.scale*dir));
  if(newScale===_lbZoom.scale)return;
  const ovRect=$('lb-ov').getBoundingClientRect();
  const cx=e.clientX-ovRect.left-ovRect.width/2;
  const cy=e.clientY-ovRect.top-ovRect.height/2;
  const r=newScale/_lbZoom.scale;
  _lbZoom.x=cx*(1-r)+_lbZoom.x*r;
  _lbZoom.y=cy*(1-r)+_lbZoom.y*r;
  _lbZoom.scale=newScale;
  if(newScale===1){_lbZoom.x=0;_lbZoom.y=0;}
  applyLbTransform();
},{passive:false});

$('lb-inner').addEventListener('mousedown',function(e){

  if(e.target.classList.contains('lb-badge')||e.target.closest&&e.target.closest('.lb-badge'))return;
  e.preventDefault();
  _lbPan={sx:e.clientX,sy:e.clientY,ox:_lbZoom.x,oy:_lbZoom.y};
  _lbPanMoved=false;
  $('lb-inner').style.cursor='grabbing';
  function onMove(me){
    if(!_lbPan)return;
    const dx=me.clientX-_lbPan.sx,dy=me.clientY-_lbPan.sy;
    if(Math.abs(dx)>3||Math.abs(dy)>3)_lbPanMoved=true;
    _lbZoom.x=_lbPan.ox+dx;_lbZoom.y=_lbPan.oy+dy;
    applyLbTransform();
  }
  function onUp(){
    _lbPan=null;
    $('lb-inner').style.cursor=_lbZoom.scale>1?'grab':'crosshair';
    document.removeEventListener('mousemove',onMove);
    document.removeEventListener('mouseup',onUp);
  }
  document.addEventListener('mousemove',onMove);
  document.addEventListener('mouseup',onUp);
});

function setupBEDrag(){
  const con=$('be-container'),items=[...con.querySelectorAll('.be')];
  let ds=null;
  items.forEach(el=>{
    // dragstart의 target은 항상 블록(.be) 자체라 헤더 여부를 판별할 수 없으므로,
    // 헤더를 누를 때만 draggable을 켜서 헤더 드래그로만 순서가 바뀌게 한다 (입력칸 텍스트 선택 방해 방지)
    const hd=el.querySelector('.be-hd');
    hd.addEventListener('mousedown',e=>{if(!e.target.closest('button')) el.draggable=true;});
    hd.addEventListener('mouseup',()=>{el.draggable=false;});
    el.addEventListener('dragstart',e=>{if(!el.draggable) return;ds=el;el.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain','');});
    el.addEventListener('dragend',()=>{el.draggable=false;el.classList.remove('dragging');items.forEach(i=>i.classList.remove('drag-over'));ds=null;});
    el.addEventListener('dragover',e=>{e.preventDefault();items.forEach(i=>i.classList.remove('drag-over'));if(el!==ds) el.classList.add('drag-over');});
    el.addEventListener('drop',e=>{e.preventDefault();if(!ds||ds===el) return;const fi=+ds.dataset.bi,ti=+el.dataset.bi;const mv=_esBlocks.splice(fi,1)[0];_esBlocks.splice(ti,0,mv);renderBE();});
  });
}

let sbDs=null,sbDsCat=null;
function setupStepDrag(){
  const scroll=$('sb-scroll');
  /* sb-scroll 요소는 유지되고 내용만 바뀌므로 리스너는 한 번만 등록
     (매 렌더마다 등록하면 리스너가 누적되어 점점 느려지고 드롭 한 번에 여러 번 이동됨) */
  if(scroll._dragBound) return;
  scroll._dragBound=true;
  scroll.addEventListener('dragstart',e=>{
    const row=e.target.closest('.sb-step-row');if(!row) return;
    sbDs=row;sbDsCat=row.dataset.cat;row.classList.add('dragging');
    e.dataTransfer.effectAllowed='move';
  },{capture:true});
  scroll.addEventListener('dragend',()=>{
    if(sbDs) sbDs.classList.remove('dragging');
    document.querySelectorAll('.sb-step-row').forEach(r=>r.classList.remove('drag-over'));
    sbDs=null;sbDsCat=null;
  },{capture:true});
  scroll.addEventListener('dragover',e=>{
    e.preventDefault();
    const row=e.target.closest('.sb-step-row');
    document.querySelectorAll('.sb-step-row').forEach(r=>r.classList.remove('drag-over'));
    if(row&&row!==sbDs&&row.dataset.cat===sbDsCat) row.classList.add('drag-over');
  },{capture:true});
  scroll.addEventListener('drop',e=>{
    e.preventDefault();
    const row=e.target.closest('.sb-step-row');if(!row||!sbDs||row===sbDs||row.dataset.cat!==sbDsCat) return;
    const cat=activeCats().find(c=>c.id===sbDsCat);if(!cat) return;
    const fi=cat.steps.findIndex(s=>s.id===sbDs.dataset.step);
    const ti=cat.steps.findIndex(s=>s.id===row.dataset.step);
    if(fi<0||ti<0) return;
    const mv=cat.steps.splice(fi,1)[0];cat.steps.splice(ti,0,mv);
    scheduleWrite();render(true);
  },{capture:true});
}

function toArr(v) {
  if (!v || typeof v !== 'object') return [];
  var a = Array.isArray(v) ? v : Object.keys(v).sort(function(a,b){ return +a - +b; }).map(function(k){ return v[k]; });
  /* 동시 편집으로 생긴 빈 칸(null) 제거 */
  return a.filter(function(x){ return x != null; });
}

          steps: toArr(cat.steps).map(function(step) {

                var b = Object.assign({}, bl);
                if (b.rows)  b.rows  = toArr(b.rows);
                if (b.items) b.items = toArr(b.items);

        });
      })

  });
}

function onlyCheckboxChanged(prev, next) {
  try {
    if (!prev || !next || prev.length !== next.length) return false;
    for (var si = 0; si < prev.length; si++) {
      var ps = prev[si], ns = next[si];
      if ((ps.cats||[]).length !== (ns.cats||[]).length) return false;
      for (var ci = 0; ci < (ps.cats||[]).length; ci++) {
        var pc = ps.cats[ci], nc = ns.cats[ci];
        if ((pc.steps||[]).length !== (nc.steps||[]).length) return false;
        for (var sti = 0; sti < (pc.steps||[]).length; sti++) {
          var pst = pc.steps[sti], nst = nc.steps[sti];
          if (pst.label !== nst.label) return false;
          if ((pst.blocks||[]).length !== (nst.blocks||[]).length) return false;
          for (var bi = 0; bi < (pst.blocks||[]).length; bi++) {
            var pb = pst.blocks[bi], nb = nst.blocks[bi];
            if (pb.type !== nb.type) return false;
            if (pb.type === 'checklist') {
              var pi = pb.items || [], ni = nb.items || [];
              if (pi.length !== ni.length) return false;
              for (var ii = 0; ii < pi.length; ii++) {
                if (pi[ii].label !== ni[ii].label) return false;
              }
            } else {
              if (JSON.stringify(pb) !== JSON.stringify(nb)) return false;
            }
          }
        }
      }
    }
    return true;
  } catch(e) { return false; }
}

/* 스크린샷 글자가 뭉개지지 않도록 고화질 유지

   2) 긴 변 최대 2560px로 줄인 PNG(무손실)가 용량 한도 이내면 PNG
   3) 아니면 고품질 WebP/JPEG(0.92→0.8), 그래도 크면 해상도를 조금씩 낮춤

var IMG_MAX_EDGE = 2560;

function compress(file) {

        var scale = Math.min(1, IMG_MAX_EDGE / Math.max(w0, h0));
        function draw(s, opaque) {
          var c = document.createElement('canvas');
          c.width = Math.max(1, Math.round(w0 * s)); c.height = Math.max(1, Math.round(h0 * s));
          var ctx = c.getContext('2d');
          ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
          if (opaque) { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); }  /* 투명 배경 → 흰색 */
          ctx.drawImage(img, 0, 0, c.width, c.height);
          return c;
        }
        function lossy(c, q) {
          var u = c.toDataURL('image/webp', q);
          if (u.indexOf('data:image/webp') !== 0) u = c.toDataURL('image/jpeg', q);  /* WebP 미지원 브라우저 */
          return u;
        }
        var png = draw(scale, false).toDataURL('image/png');
        if (png.length <= IMG_MAX_CHARS) { resolve(png); return; }
        var best = png;
        for (var s = scale; s > 0.2; s *= 0.85) {
          var c = draw(s, true), qs = [0.92, 0.86, 0.8];
          for (var i = 0; i < qs.length; i++) {
            best = lossy(c, qs[i]);
            if (best.length <= IMG_MAX_CHARS) { resolve(best); return; }
          }
        }
        resolve(best);
      };
      img.onerror = function() { resolve(orig); };
      img.src = orig;
    };
    reader.readAsDataURL(file);
  });
}

/* ─────────────────────────────────────────
   동기화 유틸
   - canon(): 키 정렬 + Firebase가 저장하지 않는 값(null/빈 배열/빈 객체) 제거 후 문자열화
             → 로컬 데이터와 Firebase에서 받은 데이터를 같은 기준으로 비교
   - diffInto(): 기준(_base) 대비 바뀐 경로만 뽑아 update()용 패치 생성
             → 전체 덮어쓰기(set) 대신 바뀐 필드만 전송하여 동시 편집 시 서로 덮어쓰지 않음
───────────────────────────────────────── */
function isObj(v) { return v !== null && typeof v === 'object'; }
function plain(v) { return v === undefined ? undefined : JSON.parse(JSON.stringify(v)); }

function canonVal(v) {
  if (v === null || v === undefined) return undefined;
  if (Array.isArray(v)) {
    var a = v.map(canonVal).filter(function(x) { return x !== undefined; });
    return a.length ? a : undefined;
  }
  if (typeof v === 'object') {
    var o = {}, has = false;
    Object.keys(v).sort().forEach(function(k) {
      var c = canonVal(v[k]);
      if (c !== undefined) { o[k] = c; has = true; }
    });
    return has ? o : undefined;
  }
  return v;
}
function canon(v) { return JSON.stringify(canonVal(v)) || ''; }

function diffInto(a, b, path, out) {
  if (isObj(a) && isObj(b) && Array.isArray(a) === Array.isArray(b)) {
    var keys = {};
    Object.keys(a).forEach(function(k) { keys[k] = 1; });
    Object.keys(b).forEach(function(k) { keys[k] = 1; });
    Object.keys(keys).forEach(function(k) {
      diffInto(a[k], b[k], path ? path + '/' + k : k, out);
    });
    return;
  }
  if (a === b || (a == null && b == null)) return;
  if ((isObj(a) || isObj(b)) && canon(a) === canon(b)) return;
  out[path] = (b === undefined) ? null : b;
}

function applyPatch(root, patch) {
  Object.keys(patch).forEach(function(p) {
    var ks = p.split('/'), o = root;
    for (var i = 0; i < ks.length - 1; i++) {
      if (!isObj(o[ks[i]])) o[ks[i]] = {};
      o = o[ks[i]];
    }
    var last = ks[ks.length - 1];
    if (patch[p] === null) delete o[last]; else o[last] = plain(patch[p]);
  });
  return root;
}

/* 이미지 배열 정규화 (Firebase가 배열을 객체로 줄 수 있음) */
function normImgs(v) {
  return toArr(v).map(function(img) {
    return Object.assign({}, img, { annotations: toArr(img.annotations) });
  });
}

/* ─────────────────────────────────────────
   저장 상태 추적
───────────────────────────────────────── */
var _base     = null;  /* 마지막으로 서버와 일치한 SYSTEMS (plain 복사본) */
var _lastJson = '';    /* canon(_base) */
var _dirty    = false; /* 아직 전송하지 않은 로컬 변경 있음 */
var _inflight = 0;     /* 서버 응답 대기 중인 쓰기 수 */
var _imgSent  = {};    /* sid → 서버와 일치하는 이미지 canon 문자열 */
var _renderPending = false;

function settle() {
  if (!_dirty && _inflight === 0) badge('synced', '동기화됨');
}
function track(p) {
  _inflight++;
  return p.then(function(v) { _inflight--; settle(); return v; },
                function(e) { _inflight--; throw e; });
}
function writeFailed(e, what) {
  console.error('[Firebase] ' + what + ' 실패:', e.code, e.message);
  if ((e.code || e.message || '').toUpperCase().indexOf('PERMISSION') >= 0) {
    badge('error', '권한 오류 (클릭)');
    showErr('Firebase 규칙을 확인해 주세요.\n\n규칙 탭에서 아래로 변경 후 게시:\n{\n  "rules": {\n    ".read": true,\n    ".write": true\n  }\n}');
  } else {
    badge('error', '저장 실패 (클릭)');
  }
}

/* ─────────────────────────────────────────
   SYSTEMS 저장 (디바운스 800ms, 바뀐 필드만 전송)
───────────────────────────────────────── */
window.scheduleWrite = function() {
  if (!_ready) return;
  var sys = window.SYSTEMS;
  if (!sys || !Array.isArray(sys) || sys.length === 0) return;
  captureUndo();  /* 변경 직전 상태를 되돌리기 스택에 기록 */
  _dirty = true;
  clearTimeout(_writeTimer);
  badge('pending', '저장 중...');
  _writeTimer = setTimeout(flushWrite, 800);
};

function flushWrite() {
  clearTimeout(_writeTimer);
  _writeTimer = null;
  if (!_dirty || !_ready) return;
  _dirty = false;
  var local = plain(window.SYSTEMS || []);
  if (!local.length) { settle(); return; }
  var patch = null;
  if (Array.isArray(_base)) {
    patch = {};
    diffInto(_base, local, '', patch);
    if (!Object.keys(patch).length) { settle(); return; }
  }
  /* 기준을 먼저 갱신해야 곧바로(동기적으로) 돌아오는 내 변경 이벤트를 원격 변경으로 오인하지 않음 */
  _base = local;
  _lastJson = canon(local);
  var p = patch ? SYS_REF.update(patch) : SYS_REF.set(local);
  track(p).catch(function(e) { writeFailed(e, '쓰기'); });
}

/* ─────────────────────────────────────────
   이미지 저장 (작업(sid) 단위로 바뀐 것만 전송)
   - 이전에는 캡션/번호 하나만 바꿔도 전체 이미지(수십 MB)를 다시 업로드했음
───────────────────────────────────────── */
window.pushImages = function(sid) {
  if (!_ready) return;
  var store = window.imgStore || {};
  var sids = sid ? [sid] : Object.keys(Object.assign({}, _imgSent, store));
  var patch = {}, n = 0;
  sids.forEach(function(k) {
    var arr = toArr(store[k]);
    var c = arr.length ? canon(arr) : '';
    if (c === (_imgSent[k] || '')) return;
    if (c) _imgSent[k] = c; else delete _imgSent[k];
    patch[k] = arr.length ? plain(arr) : null;
    n++;
  });
  if (!n) return;
  badge('pending', '저장 중...');
  track(IMGS_REF.update(patch)).catch(function(e) { writeFailed(e, '이미지 저장'); });
};

/* 작업 삭제 시 해당 작업의 이미지 제거 (IMGS_REF는 이 IIFE 안에서만 접근 가능) */
window.removeStepImages = function(sid) {
  if (!_ready) return;
  delete _imgSent[sid];
  track(IMGS_REF.child(sid).remove()).catch(function(e) {
    console.warn('[Firebase] 이미지 삭제 실패:', e.message);
  });
};

window.readFile = function(f, sid) {
  compress(f).then(function(src) {
    if (typeof addImgDOM === 'function') addImgDOM(sid, src, '', false);
  });
};

/* ─────────────────────────────────────────
   파일 가져오기
───────────────────────────────────────── */
window.importFromOldFile = function() {
  if (!confirm('다른 파일의 데이터를 Firebase에 덮어씁니다.\n모든 팀원의 화면이 해당 데이터로 교체됩니다.\n계속하시겠습니까?')) return;
  var inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.html';
  inp.onchange = function(e) {
    var file = e.target.files[0]; if (!file) return;
    var reader = new FileReader();
    reader.onload = function(ev) {
      try {
        var doc = new DOMParser().parseFromString(ev.target.result, 'text/html');
        var ds = doc.getElementById('data-store');
        if (!ds || !ds.textContent.trim()) {
          alert('저장된 데이터가 없습니다.\n💾 HTML 저장을 먼저 눌러주세요.'); return;
        }
        var sv = JSON.parse(ds.textContent);
        if (!sv.systems && !sv.cats) { alert('데이터 형식 오류'); return; }
        if (sv.cats && !sv.systems) sv.systems = [{ id: 'x1', label: 'OAS', cats: sv.cats }];
        window.SYSTEMS = normSystems(sv.systems);
        syncUid(window.SYSTEMS);
        dedupeIds(window.SYSTEMS);
        resetUndoBaseline(true);
        /* 파일에 이미지 데이터가 없거나 비어 있으면 기존 이미지를 그대로 유지
           (없는 상태로 덮어쓰면 전체 프로젝트의 스크린샷이 삭제됨) */
        var hasImgs = !!(sv.imgStore && typeof sv.imgStore === 'object' && Object.keys(sv.imgStore).length);
        if (hasImgs) {
          var imgs = {};
          Object.keys(sv.imgStore).forEach(function(k) {
            var arr = normImgs(sv.imgStore[k]);
            if (arr.length) imgs[k] = arr;
          });
          window.imgStore = imgs;
        }
        window.activeSysId = (window.SYSTEMS[0] || {}).id || '';
        window.activeCatId = (((window.SYSTEMS[0] || {}).cats || [])[0] || {}).id || '';
        if (_ready) {
          badge('pending', '업로드 중...');
          clearTimeout(_writeTimer); _writeTimer = null; _dirty = false;
          var local = plain(window.SYSTEMS);
          _base = local; _lastJson = canon(local);
          if (hasImgs) {
            _imgSent = {};
            Object.keys(window.imgStore).forEach(function(k) { _imgSent[k] = canon(window.imgStore[k]); });
          }
          if (typeof render === 'function') render();
          track(SYS_REF.set(local).then(function() {
            if (!hasImgs) return;  /* 이미지 없는 파일 → Firebase 이미지 건드리지 않음 */
            return IMGS_REF.set(plain(window.imgStore));
          })).then(function() {
            alert('✅ Firebase에 업로드 완료\n모든 팀원 화면이 자동 갱신됩니다.');
          }).catch(function(e) {
            badge('error', '업로드 실패');
            alert('업로드 실패: ' + e.message);
          });
        } else {
          if (typeof render === 'function') render();
          alert('⚠️ 오프라인 상태\n인터넷 연결 후 재연결 버튼을 눌러주세요.');
        }
      } catch(err) { alert('파일 읽기 실패: ' + err.message); }
    };
    reader.readAsText(file);
  };
  inp.click();
};

/* ─────────────────────────────────────────
   원격 변경 반영 (화면)
───────────────────────────────────────── */
function remoteRender(prev) {
  if (_typing) { _renderPending = true; return; }  /* 입력 중이면 입력이 끝난 뒤 반영 */
  _renderPending = false;

  /* 체크박스만 바뀐 경우: DOM 직접 패치 (re-render 없음) */
  if (prev && onlyCheckboxChanged(prev, window.SYSTEMS)) {
    patchCheckboxes(window.SYSTEMS);
    (window.SYSTEMS || []).forEach(function(sys) {
      (sys.cats || []).forEach(function(cat) {
        if (typeof updateProg === 'function') updateProg(cat.id);
      });
    });
    return;
  }

  /* 선택된 시스템/대메뉴가 원격에서 삭제된 경우 보정 */
  var s = (window.SYSTEMS || []).filter(function(x) { return x.id === window.activeSysId; })[0];
  if (!s) {
    s = (window.SYSTEMS || [])[0] || null;
    window.activeSysId = s ? s.id : '';
    window.activeCatId = s ? (((s.cats || [])[0] || {}).id || '') : '';
  } else if (!(s.cats || []).some(function(c) { return c.id === window.activeCatId; })) {
    window.activeCatId = ((s.cats || [])[0] || {}).id || '';
  }

  /* 구조 변경: 전체 re-render */
  if (typeof render === 'function') render(true);
}

/* ─────────────────────────────────────────
   실시간 리스너
───────────────────────────────────────── */
function onImgSnap(snap) {
  var sid = snap.key;
  var arr = normImgs(snap.val());
  var c = arr.length ? canon(arr) : '';
  if (c === (_imgSent[sid] || '')) return;  /* 내가 보낸 변경이거나 변화 없음 */
  if (c) _imgSent[sid] = c; else delete _imgSent[sid];
  if (!window.imgStore) window.imgStore = {};
  if (arr.length) window.imgStore[sid] = arr; else delete window.imgStore[sid];
  if (typeof refreshImgGrid === 'function') refreshImgGrid(sid);
  if (typeof updateRecoverBtn === 'function') updateRecoverBtn();
}

function startListening() {
  /* 재연결 시 리스너 중복 등록 방지 */
  SYS_REF.off(); IMGS_REF.off(); ONLINE_REF.off(); DB.ref('.info/connected').off();

  /* SYSTEMS 리스너 */
  SYS_REF.on('value', function(snap) {
    var raw = snap.val();
    if (!raw) return;
    var incoming = normSystems(raw);
    if (!incoming.length) return;
    var json = canon(incoming);
    if (json === _lastJson) return;  /* 내가 보낸 변경의 반영이거나 변화 없음 */

    var incomingPlain = plain(incoming);
    var next = incoming;
    if (_dirty && Array.isArray(_base)) {
      /* 아직 전송 전인 내 변경이 있으면 원격 데이터 위에 다시 얹음 (내 수정이 사라지지 않게) */
      var mine = {};
      diffInto(_base, plain(window.SYSTEMS), '', mine);
      next = normSystems(applyPatch(plain(incomingPlain), mine));
    }
    _base = incomingPlain;
    _lastJson = json;

    var prev = window.SYSTEMS;
    window.SYSTEMS = next;
    syncUid(next);
    if (dedupeIds(next)) window.scheduleWrite();  /* 중복 id가 있으면 정리 후 저장 */
    resetUndoBaseline(true);  /* 원격 변경 → 되돌리기 기준 갱신 및 스택 초기화 */
    remoteRender(prev);
    settle();
  }, function(err) {
    console.error('[Firebase] 리스너 오류:', err.code, err.message);
    _ready = false;
    badge('error', '연결 끊김 (클릭)');
    if ((err.code || '').toUpperCase().indexOf('PERMISSION') >= 0) {
      showErr('Firebase 규칙이 만료됐습니다.\n규칙 탭에서 ".read":true, ".write":true 로 설정 후 게시하세요.');
    }
  });

  /* 이미지 리스너: 작업(sid) 단위로 받아 바뀐 작업만 다시 그림 */
  IMGS_REF.on('child_added', onImgSnap);
  IMGS_REF.on('child_changed', onImgSnap);
  IMGS_REF.on('child_removed', function(snap) {
    var sid = snap.key;
    if (!_imgSent[sid] && !(window.imgStore || {})[sid]) return;
    delete _imgSent[sid];
    if (window.imgStore) delete window.imgStore[sid];
    if (typeof refreshImgGrid === 'function') refreshImgGrid(sid);
    if (typeof updateRecoverBtn === 'function') updateRecoverBtn();
  });

  /* 접속자 수 */
  DB.ref('.info/connected').on('value', function(snap) {
    if (!snap.val()) return;
    var ref = ONLINE_REF.push();
    ref.onDisconnect().remove();
    ref.set({ t: Date.now() });
  });
  ONLINE_REF.on('value', function(snap) {
    setUserCount(snap.numChildren ? snap.numChildren() : 0);
  });
}

/* ─────────────────────────────────────────
   Firebase 초기화
───────────────────────────────────────── */
function fbInit() {
  _ready = false;
  badge('pending', '연결 중...');

  /* 로컬 data-store 읽기 (Firebase가 비어 있을 때만 사용) */
  var localSystems = null, localImgs = {};
  var dsEl = document.getElementById('data-store');
  if (dsEl && dsEl.textContent.trim()) {
    try {
      var sv = JSON.parse(dsEl.textContent);
      if (sv.systems) localSystems = normSystems(sv.systems);
      if (sv.imgStore) localImgs = sv.imgStore;
    } catch(e) {}
  }

  /* Firebase에서 로드 */
  SYS_REF.once('value').then(function(snap) {
    var raw   = snap.val();
    var fbSys = raw ? normSystems(raw) : null;

    if (fbSys && fbSys.length) {
      /* Firebase가 원본. (예전에는 HTML에 저장된 옛 데이터의 작업 수가 더 많으면
         그 옛 데이터로 Firebase를 덮어써서, 삭제·수정한 내용이 되돌아가는 문제가 있었음) */
      window.SYSTEMS = fbSys;
      _base = plain(fbSys);
      _lastJson = canon(fbSys);
      window.imgStore = {};  /* 이미지는 리스너(child_added)가 채움 */
      return;
    }

    /* Firebase가 비어 있을 때만 로컬 데이터 업로드 */
    var toUpload = plain(localSystems || window.SYSTEMS || []);
    if (!toUpload.length) return;
    console.log('[Firebase] 비어 있음 → 로컬 데이터 업로드');
    badge('pending', '데이터 업로드 중...');
    window.SYSTEMS = normSystems(toUpload);
    _base = plain(toUpload);
    _lastJson = canon(toUpload);
    var imgs = Object.keys(localImgs).length ? localImgs : (window.imgStore || {});
    return SYS_REF.set(toUpload).then(function() {
      if (Object.keys(imgs).length) return IMGS_REF.update(plain(imgs));
    });
  }).then(function() {
    /* id 카운터 동기화 (Firebase 데이터엔 _uid가 없으므로 로드 후 반드시 보정) */
    syncUid(window.SYSTEMS);

    /* activeSysId 보정 */
    if (window.SYSTEMS && window.SYSTEMS.length) {
      var found = window.SYSTEMS.filter(function(s) { return s.id === window.activeSysId; });
      if (!found.length) {
        window.activeSysId = window.SYSTEMS[0].id;
        window.activeCatId = ((window.SYSTEMS[0].cats || [])[0] || {}).id || '';
      }
    }

    _ready = true;

    /* 기존 데이터에 이미 저장된 중복 id 정리 → 정리됐으면 Firebase에 반영 */
    if (dedupeIds(window.SYSTEMS)) { _dirty = true; flushWrite(); }

    /* 텍스트를 먼저 표시하고, 이미지는 도착하는 대로 작업별로 채움 */
    if (typeof render === 'function') render();
    resetUndoBaseline(true);
    settle();
    startListening();

  }).catch(function(err) {
    console.error('[Firebase] 연결 실패:', err.code, err.message);
    var code = err.code || err.message || '';
    badge('error', '연결 실패 (클릭)');
    if (code.toUpperCase().indexOf('PERMISSION') >= 0) {
      showErr('Firebase 규칙 오류\n\n규칙 탭에서 아래로 변경 후 게시:\n{\n  "rules": {\n    ".read": true,\n    ".write": true\n  }\n}');
    } else {
      showErr('연결 실패: ' + (err.message || code));
    }
  });
}

/* ─────────────────────────────────────────
   이벤트 & 실행
───────────────────────────────────────── */
/* sync-badge 클릭 → 재연결 */
var _sb = document.getElementById('sync-badge');
if (_sb) {
  _sb.addEventListener('click', function() {
    if (!_ready) fbInit();
  });
}

/* 타이핑 중 re-render 방지 → 입력이 끝나면 미뤄둔 원격 변경 반영 */
document.addEventListener('focusin', function(e) {
  if (e.target.matches('input,textarea')) _typing = true;
});
document.addEventListener('focusout', function(e) {
  if (!e.target.matches('input,textarea')) return;
  _typing = false;
  setTimeout(function() {
    if (!_typing && _renderPending) remoteRender(null);
  }, 0);
});

/* 창을 닫거나 다른 탭으로 갈 때 대기 중인 변경을 즉시 전송, 전송 완료 전이면 닫기 전에 경고 */
document.addEventListener('visibilitychange', function() {
  if (document.visibilityState === 'hidden' && _dirty) flushWrite();
});
window.addEventListener('beforeunload', function(e) {
  if (_dirty) flushWrite();
  if (_inflight > 0) { e.preventDefault(); e.returnValue = ''; }
});

/* 실행 */
fbInit();


})();
</script>
